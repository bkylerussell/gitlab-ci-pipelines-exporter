before:
  hooks:
    - make man-pages
    - make autocomplete-scripts

builds:
  - main: ./cmd/gitlab-ci-pipelines-exporter
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - 386
      - amd64
      - arm
      - arm64
    goarm: [6, 7]
    flags:
      - -trimpath

universal_binaries:
  - {}

archives:
  - name_template: '{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
    rlcp: true
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE
      - helpers/*

dockers:
  - image_templates:
      - 'docker.io/{{ .Env.CONTAINER_NAMESPACE }}/gitlab-ci-pipelines-exporter:{{ .Tag }}-amd64'
      - 'ghcr.io/{{ .Env.CONTAINER_NAMESPACE }}/gitlab-ci-pipelines-exporter:{{ .Tag }}-amd64'
    ids: [gitlab-ci-pipelines-exporter]
    goarch: amd64
    use: buildx
    build_flag_templates:
      - --platform=linux/amd64
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.description={{ .ProjectName }}
      - --label=org.opencontainers.image.url=https://github.com/{{ .Env.CONTAINER_NAMESPACE }}/gitlab-ci-pipelines-exporter
      - --label=org.opencontainers.image.source=https://github.com/{{ .Env.CONTAINER_NAMESPACE }}/gitlab-ci-pipelines-exporter
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.created={{ time "2006-01-02T15:04:05Z07:00" }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses=Apache-2.0

  - image_templates:
      - 'docker.io/{{ .Env.CONTAINER_NAMESPACE }}/gitlab-ci-pipelines-exporter:{{ .Tag }}-arm64'
      - 'ghcr.io/{{ .Env.CONTAINER_NAMESPACE }}/gitlab-ci-pipelines-exporter:{{ .Tag }}-arm64'
    ids: [gitlab-ci-pipelines-exporter]
    goarch: arm64
    use: buildx
    build_flag_templates:
      - --platform=linux/arm64
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.description={{ .ProjectName }}
      - --label=org.opencontainers.image.url=https://github.com/{{ .Env.CONTAINER_NAMESPACE }}/gitlab-ci-pipelines-exporter
      - --label=org.opencontainers.image.source=https://github.com/{{ .Env.CONTAINER_NAMESPACE }}/gitlab-ci-pipelines-exporter
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.created={{ time "2006-01-02T15:04:05Z07:00" }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses=Apache-2.0

  - image_templates:
      - 'docker.io/{{ .Env.CONTAINER_NAMESPACE }}/gitlab-ci-pipelines-exporter:{{ .Tag }}-armv6'
      - 'ghcr.io/{{ .Env.CONTAINER_NAMESPACE }}/gitlab-ci-pipelines-exporter:{{ .Tag }}-armv6'
    ids: [gitlab-ci-pipelines-exporter]
    goarch: arm
    goarm: 6
    use: buildx
    build_flag_templates:
      - --platform=linux/arm/v6
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.description={{ .ProjectName }}
      - --label=org.opencontainers.image.url=https://github.com/{{ .Env.CONTAINER_NAMESPACE }}/gitlab-ci-pipelines-exporter
      - --label=org.opencontainers.image.source=https://github.com/{{ .Env.CONTAINER_NAMESPACE }}/gitlab-ci-pipelines-exporter
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.created={{ time "2006-01-02T15:04:05Z07:00" }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses=Apache-2.0

  - image_templates:
      - 'docker.io/{{ .Env.CONTAINER_NAMESPACE }}/gitlab-ci-pipelines-exporter:{{ .Tag }}-armv7'
      - 'ghcr.io/{{ .Env.CONTAINER_NAMESPACE }}/gitlab-ci-pipelines-exporter:{{ .Tag }}-armv7'
    ids: [gitlab-ci-pipelines-exporter]
    goarch: arm
    goarm: 7
    use: buildx
    build_flag_templates:
      - --platform=linux/arm/v7
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.description={{ .ProjectName }}
      - --label=org.opencontainers.image.url=https://github.com/{{ .Env.CONTAINER_NAMESPACE }}/gitlab-ci-pipelines-exporter
      - --label=org.opencontainers.image.source=https://github.com/{{ .Env.CONTAINER_NAMESPACE }}/gitlab-ci-pipelines-exporter
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.created={{ time "2006-01-02T15:04:05Z07:00" }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses=Apache-2.0

docker_manifests:
  - name_template: docker.io/{{ .Env.CONTAINER_NAMESPACE }}/gitlab-ci-pipelines-exporter:{{ .Tag }}
    image_templates:
      - docker.io/{{ .Env.CONTAINER_NAMESPACE }}/gitlab-ci-pipelines-exporter:{{ .Tag }}-amd64
      - docker.io/{{ .Env.CONTAINER_NAMESPACE }}/gitlab-ci-pipelines-exporter:{{ .Tag }}-arm64
      - docker.io/{{ .Env.CONTAINER_NAMESPACE }}/gitlab-ci-pipelines-exporter:{{ .Tag }}-armv6
      - docker.io/{{ .Env.CONTAINER_NAMESPACE }}/gitlab-ci-pipelines-exporter:{{ .Tag }}-armv7

  - name_template: ghcr.io/{{ .Env.CONTAINER_NAMESPACE }}/gitlab-ci-pipelines-exporter:{{ .Tag }}
    image_templates:
      - ghcr.io/{{ .Env.CONTAINER_NAMESPACE }}/gitlab-ci-pipelines-exporter:{{ .Tag }}-amd64
      - ghcr.io/{{ .Env.CONTAINER_NAMESPACE }}/gitlab-ci-pipelines-exporter:{{ .Tag }}-arm64
      - ghcr.io/{{ .Env.CONTAINER_NAMESPACE }}/gitlab-ci-pipelines-exporter:{{ .Tag }}-armv6
      - ghcr.io/{{ .Env.CONTAINER_NAMESPACE }}/gitlab-ci-pipelines-exporter:{{ .Tag }}-armv7

checksum:
  name_template: '{{ .ProjectName }}_{{ .Tag }}_sha512sums.txt'
  algorithm: sha512

signs:
  - artifacts: checksum
    args:
      [
        '-u',
        '8522C0A474F52D1932C38844F9B75E419BE609E1',
        '--output',
        '${signature}',
        '--detach-sign',
        '${artifact}',
      ]

changelog:
  skip: true
